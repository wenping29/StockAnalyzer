# 前端 + API 同机部署的 nginx 配置示例
# 前端构建产物：cd frontend && npm run build → dist/
# 后端：dotnet publish -c Release -o publish 后以 systemd 服务运行（默认监听 http://localhost:5200）
#
# 安装：cp nginx.conf /etc/nginx/conf.d/fundanalysis.conf && nginx -s reload
# 域名与证书按实际修改（下方以 fund.example.com 为例）

server {
    listen 80;
    server_name fund.example.com;

    # 前端静态资源（Vue 构建产物）
    root /opt/fundanalysis/frontend/dist;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:5200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hangfire 面板（建议仅内网或加 basic auth）
    location /hangfire {
        allow 10.0.0.0/8;    # 按内网网段调整
        deny all;
        proxy_pass http://127.0.0.1:5200;
        proxy_set_header Host $host;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 运行时 API 配置文件：禁缓存（运维修改后立即生效）
    location = /config.js {
        add_header Cache-Control "no-cache";
    }
}

# HTTPS（推荐，用 certbot 自动配置）：
# sudo certbot --nginx -d fund.example.com
